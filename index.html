<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VisionOS 3D 空間電子寵物互動 - 優化版</title>
  
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    /* 全螢幕基礎重設 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* 1. 底部相機畫面：滿版置底 */
    #video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* 2. 中層 2D Canvas：用來繪製 VisionOS Bounding Box */
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    /* 3. 上層 Three.js 容器：用來渲染 3D 機器人 */
    #threejs-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 3;
      pointer-events: none;
    }

    /* 4. VisionOS 風格頂部狀態列 */
    .top-bar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 15px;
      align-items: center;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    #fps {
      color: #00ff88;
      font-family: monospace;
      font-weight: bold;
    }

    /* 5. VisionOS 風格底部控制面板 */
    .control-panel {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    #startBtn {
      padding: 14px 36px;
      font-size: 16px;
      font-weight: 600;
      color: #000;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      border-radius: 28px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3), inset 0 1px 0 rgba(255,255,255,1);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    #startBtn:hover:not(:disabled) {
      background: #ffffff;
      transform: scale(1.04);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.5);
    }

    #startBtn:active:not(:disabled) {
      transform: scale(0.98);
    }

    #startBtn:disabled {
      background: rgba(255, 255, 255, 0.3);
      color: rgba(0, 0, 0, 0.4);
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="threejs-container"></div>

  <div class="top-bar">
    <span id="statusText">正在初始化主機...</span>
    <span id="fps">AI FPS: --</span>
  </div>

  <div class="control-panel">
    <button id="startBtn" disabled>模型載入中...</button>
  </div>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");
    const fpsText = document.getElementById("fps");
    const statusText = document.getElementById("statusText");

    const MODEL_SIZE = 640;
    let session;
    let isDetecting = false;

    // 快取全域臨時 Canvas 避免記憶體洩漏
    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = MODEL_SIZE;
    tempCanvas.height = MODEL_SIZE;
    const tempCtx = tempCanvas.getContext("2d");

    // 【核心優化 1】全域預撥固定記憶體，防止反覆建立陣列導致垃圾回收（GC）爆滿卡死
    const inputBuffer = new Float32Array(3 * MODEL_SIZE * MODEL_SIZE);

    const classNames = [
      'person', 'bicycle', 'car', 'motorcycle', 'airplane', 'bus', 'train', 'truck', 'boat',
      'traffic light', 'fire hydrant', 'stop sign', 'parking meter', 'bench', 'bird', 'cat',
      'dog', 'horse', 'sheep', 'cow', 'elephant', 'bear', 'zebra', 'giraffe', 'backpack',
      'umbrella', 'handbag', 'tie', 'suitcase', 'frisbee', 'skis', 'snowboard', 'sports ball',
      'Kite', 'baseball bat', 'baseball glove', 'skateboard', 'surfboard', 'tennis racket',
      'bottle', 'wine glass', 'cup', 'fork', 'knife', 'spoon', 'bowl', 'banana', 'apple',
      'sandwich', 'orange', 'broccoli', 'carrot', 'hot dog', 'pizza', 'donut', 'cake',
      'chair', 'couch', 'potted plant', 'bed', 'dining table', 'toilet', 'tv', 'laptop',
      'mouse', 'remote', 'keyboard', 'cell phone', 'microwave', 'oven', 'toaster', 'sink',
      'refrigerator', 'book', 'clock', 'vase', 'scissors', 'teddy bear', 'hair drier', 'toothbrush'
    ];

    // --- 1. 空間音效與語音系統 ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let lastSpokenLabel = "";
    let lastSpokenTime = 0;
    let lastPingTime = 0;

    function speakObject(label) {
      const now = Date.now();
      if (label === lastSpokenLabel && now - lastSpokenTime < 5000) return;
      const msg = new SpeechSynthesisUtterance(label);
      msg.lang = "en-US";
      msg.rate = 1.1;
      msg.pitch = 1.3;
      window.speechSynthesis.speak(msg);
      lastSpokenLabel = label;
      lastSpokenTime = now;
    }

    function playSpatialPing(centerX, canvasW, distanceScale) {
      const now = Date.now();
      if (now - lastPingTime < 1000) return; // 稍微拉長間隔減少音訊處理負擔
      lastPingTime = now;
      if (!audioCtx) return;

      const panValue = (centerX / canvasW) * 2 - 1;
      const panner = audioCtx.createStereoPanner();
      panner.pan.setValueAtTime(panValue, audioCtx.currentTime);

      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = "sine";
      const baseFreq = 600 + (distanceScale * 400);
      osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.12);

      const volume = Math.min(0.12 + (distanceScale * 0.15), 0.3);
      gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

      osc.connect(gainNode);
      gainNode.connect(panner);
      panner.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    // --- 2. Three.js 3D 空間電子寵物系統 (方案 1 機器人) ---
    let scene, camera, renderer, clock;
    let petMixer, gltfScene;
    let idleAction, walkingAction, danceAction;

    const pet3D = {
      model: null,
      targetPosition: new THREE.Vector3(0, -1.2, -4),
      state: "IDLE"
    };

    function initThreeJS() {
      clock = new THREE.Clock();
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0); 

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 限制 PixelRatio 最高為 2 防止行動端卡頓
      document.getElementById("threejs-container").appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
      directionalLight.position.set(0, 2, 2);
      scene.add(directionalLight);

      // 載入方案 1 官方線上機器人模型 (RobotExpressive.glb)
      const loader = new THREE.GLTFLoader();
      const robotUrl = "https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/models/gltf/RobotExpressive.glb";
      
      statusText.innerText = "正在從雲端載入 3D 寵物...";
      
      loader.load(robotUrl, (gltf) => {
        gltfScene = gltf.scene;
        gltfScene.scale.set(0.25, 0.25, 0.25); 
        gltfScene.position.set(0, -1.2, -4);    
        scene.add(gltfScene);

        petMixer = new THREE.AnimationMixer(gltfScene);
        const clips = gltf.animations;

        idleAction = petMixer.clipAction(THREE.AnimationClip.findByName(clips, 'Idle'));
        walkingAction = petMixer.clipAction(THREE.AnimationClip.findByName(clips, 'Walking'));
        danceAction = petMixer.clipAction(THREE.AnimationClip.findByName(clips, 'Dance'));

        if(idleAction) idleAction.play();
        pet3D.model = gltfScene;
        
        console.log("3D Pet Loaded Successfully");
        statusText.innerText = "3D 寵物與 AI 準備就緒";
      }, undefined, (error) => {
        console.error("3D 模型載入失敗:", error);
        statusText.innerText = "3D 寵物載入失敗";
      });

      animateThreeJS();
    }

    function animateThreeJS() {
      requestAnimationFrame(animateThreeJS);
      const delta = clock.getDelta();

      if (petMixer) petMixer.update(delta);

      // 機器人 3D 物理追蹤 (Lerp 動態平滑插值)
      if (pet3D.model && pet3D.state === "WALKING") {
        pet3D.model.position.lerp(pet3D.targetPosition, 0.05);

        // 轉向目標
        const lookTarget = new THREE.Vector3(pet3D.targetPosition.x, pet3D.model.position.y, pet3D.targetPosition.z);
        pet3D.model.lookAt(lookTarget);

        // 到達目標切換動作
        if (pet3D.model.position.distanceTo(pet3D.targetPosition) < 0.25) {
          pet3D.state = "ACTION";
          if(walkingAction && danceAction) {
            walkingAction.crossFadeTo(danceAction, 0.3);
            danceAction.reset().play();
          }

          // 互動完 4 秒後自動恢復 Idle 狀態
          setTimeout(() => {
            if (pet3D.state === "ACTION") {
              pet3D.state = "IDLE";
              if(danceAction && idleAction) {
                danceAction.crossFadeTo(idleAction, 0.5);
                idleAction.reset().play();
              }
            }
          }, 4000);
        }
      }

      renderer.render(scene, camera);
    }

    // --- 3. YOLOv8 AI 模型系統 ---
    async function loadModel() {
      try {
        startBtn.disabled = true;
        startBtn.innerText = "模型載入中...";
        ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";

        session = await ort.InferenceSession.create(
          "./model/yolo26n.onnx", 
          { executionProviders: ["wasm"] }
        );

        console.log("YOLO Model loaded");
        startBtn.disabled = false;
        startBtn.innerText = "開始空間偵測";
        statusText.innerText = "AI 空間主機就緒";
      } catch (e) {
        console.error("YOLO 載入失敗:", e);
        startBtn.innerText = "載入失敗 (檢查模型路徑)";
        statusText.innerText = "AI 模型載入失敗";
      }
    }

    window.addEventListener('resize', () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });

    // 啟動初始化
    initThreeJS();
    loadModel();

    startBtn.onclick = async () => {
      if (isDetecting) return;

      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          isDetecting = true;
          statusText.innerText = "空間偵測中...";
          detectFrame();
        };
      } catch (err) {
        console.error("相機啟動錯誤:", err);
        alert("請確認相機權限已開啟");
      }
    };

    let lastFrameTime = performance.now();
    
    async function detectFrame() {
      if (!session || !isDetecting) return;

      const now = performance.now();
      fpsText.innerText = `AI FPS: ${Math.round(1000 / (now - lastFrameTime))}`;
      lastFrameTime = now;

      const vW = video.videoWidth;
      const vH = video.videoHeight;
      const size = Math.min(vW, vH);
      const sx = (vW - size) / 2;
      const sy = (vH - size) / 2;

      tempCtx.drawImage(video, sx, sy, size, size, 0, 0, MODEL_SIZE, MODEL_SIZE);
      const imageData = tempCtx.getImageData(0, 0, MODEL_SIZE, MODEL_SIZE);
      
      // 使用優化後的全域快取前處理
      const input = preprocess(imageData.data);
      const tensor = new ort.Tensor("float32", input, [1, 3, MODEL_SIZE, MODEL_SIZE]);

      const outputs = await session.run({ images: tensor });
      const outputData = outputs[Object.keys(outputs)[0]].cpuData;

      drawBoxes(outputData, sx, sy, size);

      // 【核心優化 2】將原本的 requestAnimationFrame 改為具備 30ms 喘息時間的 setTimeout
      // 降低推論總頻率，把 CPU 主執行緒釋放出來，網頁與 3D 渲染立馬流暢、不當機！
      setTimeout(detectFrame, 30);
    }

    // 【核心優化 1 的實作】不再重複創建 Float32Array
    function preprocess(data) {
      const frameSize = MODEL_SIZE * MODEL_SIZE;
      for (let i = 0; i < frameSize; i++) {
        inputBuffer[i] = data[i * 4] / 255; 
        inputBuffer[i + frameSize] = data[i * 4 + 1] / 255; 
        inputBuffer[i + frameSize * 2] = data[i * 4 + 2] / 255; 
      }
      return inputBuffer;
    }

    // --- 4. 2D 渲染與 3D 空間目標轉換 ---
    function drawBoxes(data, sx, sy, size) {
      if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const videoW = video.videoWidth;
      const videoH = video.videoHeight;
      const canvasW = canvas.width;
      const canvasH = canvas.height;

      const displayScale = Math.max(canvasW / videoW, canvasH / videoH);
      const xOffset = (canvasW - videoW * displayScale) / 2;
      const yOffset = (canvasH - videoH * displayScale) / 2;
      const modelToVideoScale = size / 640;

      let foundTarget = null;

      for (let i = 0; i < data.length; i += 6) {
        const score = data[i + 4];
        if (score < 0.45) continue; 

        const x = ((data[i] * modelToVideoScale) + sx) * displayScale + xOffset;
        const y = ((data[i + 1] * modelToVideoScale) + sy) * displayScale + yOffset;
        const w = (data[i + 2] - data[i]) * modelToVideoScale * displayScale;
        const h = (data[i + 3] - data[i + 1]) * modelToVideoScale * displayScale;

        const classId = Math.round(data[i + 5]);
        const label = classNames[classId] || "Object";

        if (score > 0.75) { 
          speakObject(label);
          playSpatialPing(x + w / 2, canvasW, h / canvasH);
        }

        // --- 3D 空間導航演算法 ---
        if (pet3D.state === "IDLE" && pet3D.model) {
          if (label === "person" || label === "couch" || label === "chair" || label === "bottle") {
            const centerX = x + w / 2;
            const ndcX = (centerX / canvasW) * 2 - 1; // 轉為 3D NDC 座標
            const targetX = ndcX * 3.5 * (canvasW / canvasH);
            
            // X隨物體移動，Y置於低處模擬地面(-1.2)，Z保持在人眼前方4米(-4)
            foundTarget = new THREE.Vector3(targetX, -1.2, -4);
          }
        }

        // A. 繪製圓角框
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = "rgba(0, 0, 0, 0.4)";
        ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        ctx.lineWidth = 2;
        drawRoundedRect(ctx, x, y, w, h, 12);
        ctx.stroke();
        ctx.restore();

        // B. 懸浮玻璃標籤
        ctx.font = "600 13px -apple-system, BlinkMacSystemFont, sans-serif";
        const txt = `${label.toUpperCase()} ${Math.round(score * 100)}%`;
        const txtWidth = ctx.measureText(txt).width;
        const labelW = txtWidth + 20, labelH = 28, labelX = x, labelY = y - labelH - 10;

        ctx.fillStyle = "rgba(10, 10, 10, 0.55)";
        drawRoundedRect(ctx, labelX, labelY, labelW, labelH, 14);
        ctx.fill();
        ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.textBaseline = "middle";
        ctx.fillText(txt, labelX + 10, labelY + labelH / 2 + 1);

        // C. 霓虹強化四角
        drawVisionCorners(ctx, x, y, w, h, 18);
      }

      // --- 驅動 3D 機器人尋路 ---
      if (foundTarget && pet3D.state === "IDLE") {
        pet3D.targetPosition.copy(foundTarget);
        pet3D.state = "WALKING";

        if (idleAction && walkingAction) {
          idleAction.crossFadeTo(walkingAction, 0.3);
          walkingAction.reset().play();
        }
      }
    }

    // 繪圖輔助工具函式
    function drawVisionCorners(ctx, x, y, w, h, len) {
      ctx.save();
      ctx.strokeStyle = "#00ff88";
      ctx.lineWidth = 3.5;
      ctx.lineCap = "round"; 
      ctx.shadowBlur = 8;
      ctx.shadowColor = "rgba(0, 255, 136, 0.5)";

      ctx.beginPath(); ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y + h - len); ctx.lineTo(x, y + h); ctx.lineTo(x + len, y + h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + w - len, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - len); ctx.stroke();
      ctx.restore();
    }

    function drawRoundedRect(ctx, x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
  </script>
</body>
</html>
