<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Vision AI | Spatial Freezer Pro</title>
  
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.25);
      --vibrant-green: #00ff88;
      --system-white: rgba(255, 255, 255, 0.94);
    }

    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
    }

    body {
      width: 100vw; height: 100dvh; overflow: hidden; background: #000;
      font-family: -apple-system, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      color: var(--system-white);
    }

    .camera-view { position: fixed; inset: 0; z-index: 1; }
    video { width: 100%; height: 100%; object-fit: cover; }

    .spatial-grid {
      position: fixed; inset: 0;
      background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0);
      background-size: 40px 40px;
      z-index: 3; pointer-events: none; opacity: 0.4;
    }

    canvas {
      position: absolute; inset: 0;
      z-index: 2; cursor: crosshair; touch-action: none;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 0 0 0.5px rgba(255, 255, 255, 0.2);
    }

    .header {
      position: fixed; top: calc(env(safe-area-inset-top) + 15px); left: 50%;
      transform: translateX(-50%);
      width: 90%; max-width: 500px; height: 54px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 24px; z-index: 100;
    }
    .brand { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .brand .dot { width: 8px; height: 8px; background: var(--vibrant-green); border-radius: 50%; box-shadow: 0 0 10px var(--vibrant-green); }
    #fps { font-size: 0.8rem; font-weight: 500; color: var(--vibrant-green); font-variant-numeric: tabular-nums; }

    .bottom-controls {
      position: fixed; bottom: calc(env(safe-area-inset-bottom) + 30px); left: 50%;
      transform: translateX(-50%);
      width: 90%; max-width: 400px; padding: 24px; z-index: 100; text-align: center;
    }
    .status-msg { font-size: 0.85rem; color: rgba(255, 255, 255, 0.6); margin-bottom: 20px; }
    
    .freeze-hint {
      position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
      font-size: 0.7rem; color: #fff; opacity: 0.8;
      background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 10px;
      white-space: nowrap; pointer-events: none;
    }

    #startBtn {
      width: 100%; height: 56px; border: none; border-radius: 28px;
      background: white; color: #000; font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
    }
    #startBtn:disabled { background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.3); }
  </style>
</head>

<body>
  <div class="camera-view">
    <video id="video" autoplay playsinline muted></video>
  </div>

  <div class="spatial-grid"></div>
  <canvas id="canvas"></canvas>

  <header class="header glass-panel">
    <div class="brand">
      <div class="dot"></div>
      Spatial Freezer Pro
    </div>
    <div id="fps">AI FPS: 0</div>
  </header>

  <footer class="bottom-controls glass-panel">
    <div class="freeze-hint">提示：點框定格、按住可自由拖移、點 ✕ 刪除</div>
    <div class="status-msg" id="statusText">正在初始化 AI 主機...</div>
    <button id="startBtn" disabled>模型載入中...</button>
  </footer>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true }); // 效能優化：降低畫布延遲
    const startBtn = document.getElementById("startBtn");
    const fpsText = document.getElementById("fps");
    const statusText = document.getElementById("statusText");

    const MODEL_SIZE = 640;
    let session;
    let isDetecting = false;
    let isProcessingFrame = false; // 效能優化：執行緒鎖

    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = MODEL_SIZE;
    tempCanvas.height = MODEL_SIZE;
    const tempCtx = tempCanvas.getContext("2d", { willReadFrequently: true }); // 效能優化：提示瀏覽器頻繁讀取

    // 重複使用的記憶體緩衝區
    const inputBuffer = new Float32Array(3 * MODEL_SIZE * MODEL_SIZE);

    let frozenTags = [];       
    let currentFrameDetections = []; 

    let draggingTag = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    const classNames = [
      'person', 'bicycle', 'car', 'motorcycle', 'airplane', 'bus', 'train', 'truck', 'boat',
      'traffic light', 'fire hydrant', 'stop sign', 'parking meter', 'bench', 'bird', 'cat',
      'dog', 'horse', 'sheep', 'cow', 'elephant', 'bear', 'zebra', 'giraffe', 'backpack',
      'umbrella', 'handbag', 'tie', 'suitcase', 'frisbee', 'skis', 'snowboard', 'sports ball',
      'Kite', 'baseball bat', 'baseball glove', 'skateboard', 'surfboard', 'tennis racket',
      'bottle', 'wine glass', 'cup', 'fork', 'knife', 'spoon', 'bowl', 'banana', 'apple',
      'sandwich', 'orange', 'broccoli', 'carrot', 'hot dog', 'pizza', 'donut', 'cake',
      'chair', 'couch', 'potted plant', 'bed', 'dining table', 'toilet', 'tv', 'laptop',
      'mouse', 'remote', 'keyboard', 'cell phone', 'microwave', 'oven', 'toaster', 'sink',
      'refrigerator', 'book', 'clock', 'vase', 'scissors', 'teddy bear', 'hair drier', 'toothbrush'
    ];

    // --- 1. 語音與音效系統 ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function speakObject(label) {
      window.speechSynthesis.cancel(); 
      const msg = new SpeechSynthesisUtterance(label);
      msg.lang = "en-US"; msg.rate = 1.15; msg.pitch = 1.2;
      window.speechSynthesis.speak(msg);
    }

    function playSpatialPing(centerX, canvasW, distanceScale) {
      if (!audioCtx || audioCtx.state === 'suspended') return;
      const panValue = (centerX / canvasW) * 2 - 1;
      const panner = audioCtx.createStereoPanner();
      panner.pan.setValueAtTime(panValue, audioCtx.currentTime);

      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(550 + (distanceScale * 250), audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.15);
      gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

      osc.connect(gainNode); gainNode.connect(panner); panner.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    }

    function playDeleteSound() {
      if (!audioCtx || audioCtx.state === 'suspended') return;
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = "triangle"; 
      osc.frequency.setValueAtTime(350, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.12); 
      gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      osc.connect(gainNode); gainNode.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.12);
    }

    // --- 2. AI 模型載入與啟動 ---
    async function loadModel() {
      try {
        startBtn.disabled = true;
        ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";
        
        // 效能優化：設定 ORT 的執行緒數量與優化等級
        const threads = navigator.hardwareConcurrency ? Math.max(1, navigator.hardwareConcurrency - 2) : 2;
        const options = {
          executionProviders: ["wasm"],
          graphOptimizationLevel: "all",
          intraOpNumThreads: threads
        };
        
        session = await ort.InferenceSession.create("./model/yolo26n.onnx", options);
        startBtn.disabled = false;
        startBtn.innerText = "開始空間偵測";
        statusText.innerText = "AI 空間主機已就緒 (高效能模式)";
      } catch (e) { statusText.innerText = "AI 模型載入失敗"; console.error(e); }
    }
    loadModel();

    startBtn.onclick = async () => {
      if (isDetecting) return;
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth; canvas.height = video.videoHeight;
          isDetecting = true;
          statusText.innerText = "偵測中... 點擊綠框可定格，按住可拖移";
          requestAnimationFrame(detectFrame); // 效能優化：啟動對齊螢幕刷新率的偵測迴圈
        };
      } catch (err) { alert("請確認相機權限已開啟"); }
    };

    let lastFrameTime = performance.now();
    
    async function detectFrame() {
      // 效能優化：如果模型沒準備好，或「上一幀還在算」，就直接跳過，絕不塞車當機
      if (!session || !isDetecting || isProcessingFrame) {
        if (isDetecting) requestAnimationFrame(detectFrame);
        return;
      }
      
      isProcessingFrame = true;

      try {
        const now = performance.now();
        fpsText.innerText = `AI FPS: ${Math.round(1000 / (now - lastFrameTime))}`;
        lastFrameTime = now;

        const vW = video.videoWidth; const vH = video.videoHeight;
        if (vW === 0 || vH === 0) throw new Error("Video not ready");

        const size = Math.min(vW, vH);
        const sx = (vW - size) / 2; const sy = (vH - size) / 2;

        tempCtx.drawImage(video, sx, sy, size, size, 0, 0, MODEL_SIZE, MODEL_SIZE);
        const imgData = tempCtx.getImageData(0, 0, MODEL_SIZE, MODEL_SIZE).data;
        const input = preprocess(imgData);
        
        const tensor = new ort.Tensor("float32", input, [1, 3, MODEL_SIZE, MODEL_SIZE]);
        const outputs = await session.run({ images: tensor });
        
        processAndDrawBoxes(outputs[Object.keys(outputs)[0]].cpuData, sx, sy, size);
      } catch (e) {
        console.warn("偵測跳幀保護:", e);
      } finally {
        isProcessingFrame = false;
        requestAnimationFrame(detectFrame); // 算完才呼叫下一幀
      }
    }

    // 效能優化：加速預處理迴圈
    function preprocess(data) {
      const frameSize = MODEL_SIZE * MODEL_SIZE;
      const INV_255 = 1.0 / 255.0; // 避免在迴圈內做除法
      for (let i = 0; i < frameSize; i++) {
        const idx = i * 4;
        inputBuffer[i]                 = data[idx]     * INV_255; 
        inputBuffer[i + frameSize]     = data[idx + 1] * INV_255; 
        inputBuffer[i + frameSize * 2] = data[idx + 2] * INV_255; 
      }
      return inputBuffer;
    }

    // --- 3. 核心運算與繪製 ---
    function processAndDrawBoxes(data, sx, sy, size) {
      if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
        canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const videoW = video.videoWidth; const videoH = video.videoHeight;
      const canvasW = canvas.width; const canvasH = canvas.height;
      const displayScale = Math.max(canvasW / videoW, canvasH / videoH);
      const xOffset = (canvasW - videoW * displayScale) / 2;
      const yOffset = (canvasH - videoH * displayScale) / 2;
      const modelToVideoScale = size / 640;

      currentFrameDetections = [];

      for (let i = 0; i < data.length; i += 6) {
        if (data[i + 4] < 0.45) continue; 
        const v_x = (data[i] * modelToVideoScale) + sx;
        const v_y = (data[i + 1] * modelToVideoScale) + sy;
        const v_w = (data[i + 2] - data[i]) * modelToVideoScale;
        const v_h = (data[i + 3] - data[i + 1]) * modelToVideoScale;
        currentFrameDetections.push({
          x: v_x * displayScale + xOffset, y: v_y * displayScale + yOffset,
          w: v_w * displayScale, h: v_h * displayScale,
          vx: v_x, vy: v_y, vw: v_w, vh: v_h, 
          label: classNames[Math.round(data[i + 5])] || "Object", score: data[i + 4]
        });
      }

      for (const tag of frozenTags) { drawSingleVisualTag(ctx, tag, 'frozen'); }
      for (const tag of currentFrameDetections) { drawSingleVisualTag(ctx, tag, 'active'); }
    }

    function drawSingleVisualTag(ctx, tag, type) {
      const { x, y, w, h, label, score, imgSnippet } = tag;
      const isBeingDragged = (tag === draggingTag);
      
      ctx.save();
      if (isBeingDragged) {
        ctx.translate(x + w/2, y + h/2);
        ctx.scale(1.03, 1.03);
        ctx.translate(-(x + w/2), -(y + h/2));
      }

      if (type === 'frozen' && imgSnippet) {
        ctx.save(); drawRoundedRect(ctx, x, y, w, h, 12); ctx.clip();
        ctx.globalAlpha = isBeingDragged ? 0.95 : 0.85; 
        ctx.drawImage(imgSnippet, x, y, w, h); ctx.restore();
      }

      ctx.globalAlpha = type === 'active' ? 1.0 : (isBeingDragged ? 0.9 : 0.6);
      ctx.shadowBlur = type === 'active' ? 15 : (isBeingDragged ? 25 : 6);
      ctx.shadowColor = type === 'active' ? "rgba(0,0,0,0.4)" : (isBeingDragged ? "rgba(0,255,136,0.6)" : "rgba(0,0,0,0.2)");
      ctx.strokeStyle = type === 'active' ? "rgba(255,255,255,0.8)" : "rgba(0,255,136,0.4)";
      ctx.lineWidth = type === 'active' ? 2 : 1.5;
      drawRoundedRect(ctx, x, y, w, h, 12); ctx.stroke();

      ctx.font = "600 13px -apple-system, BlinkMacSystemFont, sans-serif";
      const txt = label.toUpperCase(); 
      const txtW = ctx.measureText(txt).width;
      const labelW = txtW + 20 + (type === 'frozen' ? 26 : 0);
      const labelH = 28;
      const labelY = y - labelH - (type === 'active' ? 10 : 15);

      ctx.fillStyle = type === 'active' ? "rgba(10,10,10,0.6)" : (isBeingDragged ? "rgba(0,50,25,0.9)" : "rgba(0,30,15,0.8)");
      drawRoundedRect(ctx, x, labelY, labelW, labelH, 14); ctx.fill();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.2)"; ctx.stroke();

      ctx.fillStyle = "#ffffff"; ctx.textBaseline = "middle";
      ctx.fillText(txt, x + 10, labelY + labelH / 2 + 1);

      if (type === 'active') {
        drawVisionCorners(ctx, x, y, w, h, 18);
      } else {
        const closeX = x + labelW - 18, closeY = labelY + labelH / 2;
        ctx.save(); ctx.strokeStyle = "rgba(255, 255, 255, 0.6)"; ctx.lineWidth = 1.8; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(closeX - 4, closeY - 4); ctx.lineTo(closeX + 4, closeY + 4);
        ctx.moveTo(closeX + 4, closeY - 4); ctx.lineTo(closeX - 4, closeY + 4); ctx.stroke(); ctx.restore();
      }
      ctx.restore();
    }

    // --- 4. 拖移與點擊事件控制中心 ---
    function getPointerPos(e, inputType) {
      const rect = canvas.getBoundingClientRect();
      if (inputType === 'mouse') return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
      return { x: 0, y: 0 };
    }

    function handleDown(e, inputType) {
      if (!isDetecting || !audioCtx) return;
      const pos = getPointerPos(e, inputType);

      ctx.font = "600 13px -apple-system, BlinkMacSystemFont, sans-serif"; 
      
      for (let i = frozenTags.length - 1; i >= 0; i--) {
        const tag = frozenTags[i];
        const txt = tag.label.toUpperCase(); 
        const labelW = ctx.measureText(txt).width + 20 + 26; 
        const labelH = 28;
        const labelY = tag.y - labelH - 15;

        // 點擊刪除按鈕
        if (pos.x >= (tag.x + labelW - 28) && pos.x <= (tag.x + labelW) &&
            pos.y >= labelY && pos.y <= (labelY + labelH)) {
          
          // 效能優化：主動清除不再使用的圖形元素釋放記憶體
          if (tag.imgSnippet) { tag.imgSnippet.width = 0; tag.imgSnippet = null; }
          frozenTags.splice(i, 1);
          
          playDeleteSound(); 
          statusText.innerText = "🗑️ 空間定格已解除";
          return; 
        }

        // 點擊拖移
        if ((pos.x >= tag.x && pos.x <= tag.x + tag.w && pos.y >= tag.y && pos.y <= tag.y + tag.h) ||
            (pos.x >= tag.x && pos.x <= tag.x + labelW && pos.y >= labelY && pos.y <= labelY + labelH)) {
          draggingTag = tag;
          dragOffsetX = pos.x - tag.x; dragOffsetY = pos.y - tag.y;
          frozenTags.splice(i, 1); frozenTags.push(tag);
          return;
        }
      }

      // 新增定格
      for (let i = currentFrameDetections.length - 1; i >= 0; i--) {
        const tag = currentFrameDetections[i];
        if (pos.x >= tag.x && pos.x <= tag.x + tag.w && pos.y >= tag.y && pos.y <= tag.y + tag.h) {
          const frozenItem = { ...tag };
          const snippetCanvas = document.createElement('canvas');
          snippetCanvas.width = tag.w; snippetCanvas.height = tag.h;
          snippetCanvas.getContext('2d').drawImage(video, tag.vx, tag.vy, tag.vw, tag.vh, 0, 0, tag.w, tag.h);
          frozenItem.imgSnippet = snippetCanvas; 

          frozenTags.push(frozenItem);
          
          // 效能優化：當定格數量過多時，主動回收被擠掉的畫布
          if (frozenTags.length > 20) {
            const removed = frozenTags.shift();
            if (removed.imgSnippet) { removed.imgSnippet.width = 0; removed.imgSnippet = null; }
          }

          speakObject(tag.label);
          playSpatialPing(tag.x + tag.w / 2, canvas.width, tag.h / canvas.height);
          statusText.innerText = `❄️ 成功定格：${tag.label.toUpperCase()}`;
          return;
        }
      }
    }

    function handleMove(e, inputType) {
      if (!draggingTag) return;
      const pos = getPointerPos(e, inputType);
      draggingTag.x = pos.x - dragOffsetX;
      draggingTag.y = pos.y - dragOffsetY;
    }
    function handleUp() { draggingTag = null; }

    canvas.addEventListener('mousedown', (e) => handleDown(e, 'mouse'));
    canvas.addEventListener('mousemove', (e) => handleMove(e, 'mouse'));
    canvas.addEventListener('mouseup', handleUp);
    canvas.addEventListener('mouseleave', handleUp);
    canvas.addEventListener('touchstart', (e) => { if (e.cancelable) e.preventDefault(); handleDown(e, 'touch'); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { if (e.cancelable) e.preventDefault(); handleMove(e, 'touch'); }, { passive: false });
    canvas.addEventListener('touchend', handleUp);
    canvas.addEventListener('touchcancel', handleUp);

    // --- 5. 繪圖輔助 ---
    function drawVisionCorners(ctx, x, y, w, h, len) {
      ctx.save(); ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 3.5; ctx.lineCap = "round";
      ctx.shadowBlur = 8; ctx.shadowColor = "rgba(0, 255, 136, 0.5)";
      ctx.beginPath(); ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y + h - len); ctx.lineTo(x, y + h); ctx.lineTo(x + len, y + h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + w - len, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - len); ctx.stroke();
      ctx.restore();
    }
    function drawRoundedRect(ctx, x, y, w, h, r) {
      if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2;
      ctx.beginPath(); ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }
  </script>
</body>
</html>
