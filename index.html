<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Vision AI | Spatial Freezer Tagging</title>
  
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.25);
      --vibrant-green: #00ff88;
      --system-white: rgba(255, 255, 255, 0.94);
    }

    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
    }

    body {
      width: 100vw; height: 100dvh; overflow: hidden; background: #000;
      font-family: -apple-system, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      color: var(--system-white);
    }

    /* 1. 底層相機畫面 */
    .camera-view {
      position: fixed; inset: 0; z-index: 1;
    }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* 2. 裝飾性空間網格 ( pointer-events: none 穿透點擊 ) */
    .spatial-grid {
      position: fixed; inset: 0;
      background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0);
      background-size: 40px 40px;
      z-index: 3; pointer-events: none; opacity: 0.5;
    }
    .indicator {
      position: absolute; width: 100%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      z-index: 4; pointer-events: none; animation: float 6s ease-in-out infinite;
    }
    @keyframes float { 0%, 100% { top: 30%; opacity: 0; } 50% { top: 70%; opacity: 1; } }

    /* 3. 交互性 2D 偵測圖層 */
    canvas {
      position: absolute; inset: 0;
      /* 重要修正：提升 z-index，移除 none，設置準星光標 */
      z-index: 2; cursor: crosshair;
    }

    /* 4. VisionOS 漂浮 UI ( z-index 最高 ) */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 0 0 0.5px rgba(255, 255, 255, 0.2);
    }

    .header {
      position: fixed; top: calc(env(safe-area-inset-top) + 15px); left: 50%;
      transform: translateX(-50%);
      width: 90%; max-width: 500px; height: 54px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 24px; z-index: 100;
    }
    .brand { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .brand .dot { width: 8px; height: 8px; background: var(--vibrant-green); border-radius: 50%; box-shadow: 0 0 10px var(--vibrant-green); }
    #fps { font-size: 0.8rem; font-weight: 500; color: var(--vibrant-green); font-variant-numeric: tabular-nums; }

    .bottom-controls {
      position: fixed; bottom: calc(env(safe-area-inset-bottom) + 30px); left: 50%;
      transform: translateX(-50%);
      width: 90%; max-width: 400px; padding: 24px; z-index: 100; text-align: center;
    }
    .status-msg { font-size: 0.85rem; color: rgba(2 system-white, 0.6); margin-bottom: 20px; }
    
    /* 凍結功能指令說明標籤 */
    .freeze-hint {
      position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
      font-size: 0.7rem; color: #fff; opacity: 0.8;
      background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 10px;
      white-space: nowrap; pointer-events: none;
    }

    #startBtn {
      width: 100%; height: 56px; border: none; border-radius: 28px;
      background: white; color: #000; font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
    }
    #startBtn:disabled { background: rgba(255, 255, 255, 0.1); color: rgba(25系統-white, 0.3); }
  </style>
</head>

<body>
  <div class="camera-view">
    <video id="video" autoplay playsinline muted></video>
  </div>

  <div class="spatial-grid"></div>
  <div class="indicator"></div>

  <canvas id="canvas"></canvas>

  <header class="header glass-panel">
    <div class="brand">
      <div class="dot"></div>
      Spatial Freezer
    </div>
    <div id="fps">AI FPS: 0</div>
  </header>

  <footer class="bottom-controls glass-panel">
    <div class="freeze-hint">指示：在偵測中，點擊任何霓虹框可將其「凍結」在畫面上</div>
    
    <div class="status-msg" id="statusText">正在初始化 AI 主機...</div>
    <button id="startBtn" disabled>模型載入中...</button>
  </footer>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");
    const fpsText = document.getElementById("fps");
    const statusText = document.getElementById("statusText");

    const MODEL_SIZE = 640;
    let session;
    let isDetecting = false;

    // 快取全域臨時 Canvas 避免記憶體洩漏
    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = MODEL_SIZE;
    tempCanvas.height = MODEL_SIZE;
    const tempCtx = tempCanvas.getContext("2d");

    // 【核心優化】全域預撥固定記憶體緩衝區 (Float32Array)，徹底解決反覆建立陣列導致 GC 爆滿卡死當機問題
    const inputBuffer = new Float32Array(3 * MODEL_SIZE * MODEL_SIZE);

    // 【新增狀態】用來存儲被「凍結」的空間標籤
    let frozenTags = [];
    // 用來記錄當前影格的即時偵測資料，供交互點擊判定使用
    let currentFrameDetections = [];

    const classNames = [
      'person', 'bicycle', 'car', 'motorcycle', 'airplane', 'bus', 'train', 'truck', 'boat',
      'traffic light', 'fire hydrant', 'stop sign', 'parking meter', 'bench', 'bird', 'cat',
      'dog', 'horse', 'sheep', 'cow', 'elephant', 'bear', 'zebra', 'giraffe', 'backpack',
      'umbrella', 'handbag', 'tie', 'suitcase', 'frisbee', 'skis', 'snowboard', 'sports ball',
      'Kite', 'baseball bat', 'baseball glove', 'skateboard', 'surfboard', 'tennis racket',
      'bottle', 'wine glass', 'cup', 'fork', 'knife', 'spoon', 'bowl', 'banana', 'apple',
      'sandwich', 'orange', 'broccoli', 'carrot', 'hot dog', 'pizza', 'donut', 'cake',
      'chair', 'couch', 'potted plant', 'bed', 'dining table', 'toilet', 'tv', 'laptop',
      'mouse', 'remote', 'keyboard', 'cell phone', 'microwave', 'oven', 'toaster', 'sink',
      'refrigerator', 'book', 'clock', 'vase', 'scissors', 'teddy bear', 'hair drier', 'toothbrush'
    ];

    // --- 1. 空間音效與語音系統 (保留優化後的冷卻時間) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let lastSpokenLabel = "";
    let lastSpokenTime = 0;
    let lastPingTime = 0;

    function speakObject(label) {
      const now = Date.now();
      if (label === lastSpokenLabel && now - lastSpokenTime < 5000) return;
      const msg = new SpeechSynthesisUtterance(label);
      msg.lang = "en-US";
      msg.rate = 1.1;
      msg.pitch = 1.3;
      window.speechSynthesis.speak(msg);
      lastSpokenLabel = label;
      lastSpokenTime = now;
    }

    function playSpatialPing(centerX, canvasW, distanceScale) {
      const now = Date.now();
      if (now - lastPingTime < 1000) return;
      lastPingTime = now;
      if (!audioCtx) return;

      const panValue = (centerX / canvasW) * 2 - 1;
      const panner = audioCtx.createStereoPanner();
      panner.pan.setValueAtTime(panValue, audioCtx.currentTime);

      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = "sine";
      const baseFreq = 600 + (distanceScale * 400);
      osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.12);

      const volume = Math.min(0.12 + (distanceScale * 0.15), 0.3);
      gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

      osc.connect(gainNode);
      gainNode.connect(panner);
      panner.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    // --- 2. YOLOv8 AI 模型核心系統 ---
    async function loadModel() {
      try {
        startBtn.disabled = true;
        startBtn.innerText = "AI 模型載入中...";
        ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";

        session = await ort.InferenceSession.create(
          "./model/yolo26n.onnx", 
          { executionProviders: ["wasm"] }
        );

        console.log("YOLO Model loaded successfully");
        startBtn.disabled = false;
        startBtn.innerText = "開始空間偵測";
        statusText.innerText = "AI 空間主機已就緒";
      } catch (e) {
        console.error("YOLO 載入失敗:", e);
        startBtn.innerText = "載入失敗 (檢查模型檔案路徑)";
        statusText.innerText = "AI 模型載入失敗，無法啟動";
      }
    }

    // 啟動初始化
    loadModel();

    startBtn.onclick = async () => {
      if (isDetecting) return;

      // 解鎖 AudioContext (必須由使用者交互觸發)
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }, // 手機環境優先使用後置鏡頭
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          // 同步螢幕解析度至 Canvas
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          isDetecting = true;
          statusText.innerText = "空間偵測中... (點擊霓虹框可凍結標籤)";
          detectFrame();
        };
      } catch (err) {
        console.error("相機啟動錯誤:", err);
        alert("請確認相機權限已開啟");
      }
    };

    let lastFrameTime = performance.now();
    async function detectFrame() {
      if (!session || !isDetecting) return;

      // AI 推論 FPS 計算與顯示
      const now = performance.now();
      fpsText.innerText = `AI FPS: ${Math.round(1000 / (now - lastFrameTime))}`;
      lastFrameTime = now;

      // 影像裁切資訊準備 ( object-fit: cover 中心正方形裁切)
      const vW = video.videoWidth;
      const vH = video.videoHeight;
      const size = Math.min(vW, vH);
      const sx = (vW - size) / 2;
      const sy = (vH - size) / 2;

      // 1. 影像前處理：中心正方形裁切、縮放至 640x640、寫入inputBuffer
      tempCtx.drawImage(video, sx, sy, size, size, 0, 0, MODEL_SIZE, MODEL_SIZE);
      const imageData = tempCtx.getImageData(0, 0, MODEL_SIZE, MODEL_SIZE);
      
      const input = preprocess(imageData.data);
      
      // 2. 建立 Tensor
      const tensor = new ort.Tensor("float32", input, [1, 3, MODEL_SIZE, MODEL_SIZE]);

      // 3. 執行 AI 模型推論 (await 為阻塞操作)
      const outputs = await session.run({ images: tensor });
      const outputData = outputs[Object.keys(outputs)[0]].cpuData;

      // 4. 解析推論結果與綜合繪製 (傳入裁切資訊)
      processAndDrawBoxes(outputData, sx, sy, size);

      // 【核心優化】不用 requestAnimationFrame 壓榨 CPU，故意延遲 30ms 釋放 CPU 時間跑 UI 與語音
      setTimeout(detectFrame, 30);
    }

    // 【核心優化的實作】不再重複創建 Float32Array
    function preprocess(data) {
      const frameSize = MODEL_SIZE * MODEL_SIZE;
      for (let i = 0; i < frameSize; i++) {
        inputBuffer[i] = data[i * 4] / 255; 
        inputBuffer[i + frameSize] = data[i * 4 + 1] / 255; 
        inputBuffer[i + frameSize * 2] = data[i * 4 + 2] / 255; 
      }
      return inputBuffer;
    }

    // --- 3. 解析結果、綜合繪製與凍結系統邏輯 ---
    function processAndDrawBoxes(data, sx, sy, size) {
      // 自動同步 Canvas 畫布解析度與 CSS 顯示大小 (解決模糊與偏移)
      if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const videoW = video.videoWidth;
      const videoH = video.videoHeight;
      const canvasW = canvas.width;
      const canvasH = canvas.height;

      // 計算 object-fit: cover 的顯示縮放與位移鏈條
      const displayScale = Math.max(canvasW / videoW, canvasH / videoH);
      const xOffset = (canvasW - videoW * displayScale) / 2;
      const yOffset = (canvasH - videoH * displayScale) / 2;
      
      // 模型座標還原比例
      const modelToVideoScale = size / 640;

      // 【新增】更新當前影格的即時偵測快取
      currentFrameDetections = [];

      for (let i = 0; i < data.length; i += 6) {
        const score = data[i + 4];
        if (score < 0.45) continue; // 信心門檻

        // 座標轉換鏈條：模型 -> 視訊裁切區 -> 原始視訊 -> 螢幕 Canvas
        const x_screen = ((data[i] * modelToVideoScale) + sx) * displayScale + xOffset;
        const y_screen = ((data[i + 1] * modelToVideoScale) + sy) * displayScale + yOffset;
        const w_screen = (data[i + 2] - data[i]) * modelToVideoScale * displayScale;
        const h_screen = (data[i + 3] - data[i + 1]) * modelToVideoScale * displayScale;

        const classId = Math.round(data[i + 5]);
        const label = classNames[classId] || "Object";

        // 存入當前影格快取
        currentFrameDetections.push({
          x: x_screen, y: y_screen, w: w_screen, h: h_screen, label: label, score: score
        });

        // 空間語音與音效觸發邏輯 (保留優化後的冷卻機制)
        if (score > 0.75) { 
          speakObject(label);
          const centerX = x_screen + w_screen / 2;
          const distanceScale = h_screen / canvasH; // 框高比例代表距離
          playSpatialPing(centerX, canvasW, distanceScale);
        }
      }

      // --- 【新增 重大重構】綜合渲染循環 ---

      // A. 繪製：凍結狀態的標籤 ( Style A: Faint, no corners, no animation)
      // 它們是「過去」的遺留，飄浮在螢幕上
      for (const tag of frozenTags) {
        drawSingleVisualTag(ctx, tag, 'frozen');
      }

      // B. 繪製：即時偵測中的標籤 ( Style B: Neon, rounded rect, label,Corners )
      for (const tag of currentFrameDetections) {
        drawSingleVisualTag(ctx, tag, 'active');
      }
    }

    // --- 輔助函式：繪製單個標籤的視覺樣式 (整合原本的 VisionOS 風格) ---
    function drawSingleVisualTag(ctx, tag, type) {
      const { x, y, w, h, label, score } = tag;

      // 基本設定與毛玻璃陰影特效 (根據狀態調整透明度)
      ctx.save();
      
      // 凍結的標籤看起來更透明，像記憶一樣
      ctx.globalAlpha = type === 'active' ? 1.0 : 0.45;
      
      ctx.shadowBlur = type === 'active' ? 15 : 8; // 動態框發光更強
      ctx.shadowColor = type === 'active' ? "rgba(0, 0, 0, 0.4)" : "rgba(0,0,0,0.2)";

      // A. 主體圓角框線 (白色半透明)
      ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
      ctx.lineWidth = type === 'active' ? 2 : 1.2;
      drawRoundedRect(ctx, x, y, w, h, 12);
      ctx.stroke();

      // B. 懸浮資訊標籤 (玻璃質感面板)
      const font = "600 13px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.font = font;
      const txt = `${label.toUpperCase()} ${Math.round(score * 100)}%`;
      const txtWidth = ctx.measureText(txt).width;
      
      const labelW = txtWidth + 20;
      const labelH = 28;
      const labelX = x;
      // 向左偏移，凍結的標籤向下偏移，增加不同的懸浮感
      const labelY = y - labelH - (type === 'active' ? 10 : 15); 

      // 標籤背景 (深色毛玻璃)
      ctx.fillStyle = "rgba(10, 10, 10, 0.55)";
      drawRoundedRect(ctx, labelX, labelY, labelW, labelH, 14);
      ctx.fill();
      
      // 標籤細邊框
      ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
      ctx.lineWidth = 1;
      ctx.stroke();

      // 標籤文字 (純白)
      ctx.fillStyle = "#ffffff";
      ctx.textBaseline = "middle";
      ctx.fillText(txt, labelX + 10, labelY + labelH / 2 + 1);

      // C. 即時狀態額外繪製：霓虹強化四角 (調用 drawVisionCorners)
      if (type === 'active') {
        drawVisionCorners(ctx, x, y, w, h, 18);
      } else {
        // 凍結狀態可以選擇加一個「雪花」圖示或「釘子」圖示
        ctx.fillStyle = "#fff";
        ctx.font = "bold 10px monospace";
        ctx.fillText("❄️ FROZEN", labelX + labelW - 55, labelY + labelH / 2 + 1);
      }

      ctx.restore();
    }

    // --- 4. 【新增重大系統】Canvas 交互系統：凍結捕獲邏輯 ---
    canvas.addEventListener('mousedown', (e) => handleCanvasClick(e, 'mouse'));
    canvas.addEventListener('touchstart', (e) => handleCanvasClick(e, 'touch'));

    function handleCanvasClick(e, inputType) {
      if (!isDetecting || currentFrameDetections.length === 0) return;
      if (!audioCtx) return; // 需要 AudioContext 才能觸發捕獲音效

      // 取得點擊在 Canvas 螢幕座標上的位置
      const rect = canvas.getBoundingClientRect();
      let clickX, clickY;
      
      if (inputType === 'mouse') {
        clickX = e.clientX - rect.left;
        clickY = e.clientY - rect.top;
      } else {
        // 處理多指觸控，只取第一個手指
        if (e.touches.length > 0) {
          clickX = e.touches[0].clientX - rect.left;
          clickY = e.touches[0].clientY - rect.top;
        } else return;
      }

      // 用來記錄是否有捕獲成功
      let capturedSuccessfully = false;

      // 按順序遞迴所有即時偵測框 (後面的框疊在上面，所以優先判定)
      // 為了判定正確，從後往前尋找
      for (let i = currentFrameDetections.length - 1; i >= 0; i--) {
        const tag = currentFrameDetections[i];
        
        // **核心交互算法**：檢查點擊點是否落在框框範圍內
        if (clickX >= tag.x && clickX <= tag.x + tag.w &&
            clickY >= tag.y && clickY <= tag.y + tag.h) {
          
          // 成功捕獲！

          // 將其捕獲並存入 frozenTags 陣列 (它會自動成為「Style A: Frozen」)
          frozenTags.push({...tag});
          
          capturedSuccessfully = true;

          // 播放「捕獲成功」的立體聲音效 (一個科幻的「嗶」聲並快速淡出)
          playCapturePing(audioCtx);

          break; // 只捕獲最上層的一個框，不再繼續尋找
        }
      }

      if (capturedSuccessfully) {
        // 更新狀態文字通知使用者 (3秒後恢復)
        const oldText = statusText.innerText;
        statusText.innerText = "❄️ 空間標籤已凍結！ 移動相機可觀察。";
        setTimeout(() => { if (isDetecting) statusText.innerText = oldText; }, 3000);
      }
    }

    // 輔助函式：播放捕獲成功的科幻嗶聲
    function playCapturePing(audioCtx) {
      if (audioCtx.state === 'suspended') return;
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = "square"; // 方波聽起來更像復古科幻
      osc.frequency.setValueAtTime(1000, audioCtx.currentTime); // 1000Hz 嗶聲
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08); // 嗶——
      gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1); // 快速淡出
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    // --- 輔助函式：繪圖輔助與轉角專用 ---
    function drawVisionCorners(ctx, x, y, w, h, len) {
      ctx.save();
      ctx.strokeStyle = "#00ff88"; // Vision 主題綠色
      ctx.lineWidth = 3.5;
      ctx.lineCap = "round"; // 讓線段末端圓潤
      ctx.shadowBlur = 8;
      ctx.shadowColor = "rgba(0, 255, 136, 0.5)";

      // 左上角
      ctx.beginPath();
      ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y);
      ctx.stroke();

      // 右上角
      ctx.beginPath();
      ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len);
      ctx.stroke();

      // 左下角
      ctx.beginPath();
      ctx.moveTo(x, y + h - len); ctx.lineTo(x, y + h); ctx.lineTo(x + len, y + h);
      ctx.stroke();

      // 右下角
      ctx.beginPath();
      ctx.moveTo(x + w - len, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - len);
      ctx.stroke();

      ctx.restore();
    }

    function drawRoundedRect(ctx, x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
  </script>
